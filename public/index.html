<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoaDja</title>
    <link rel="icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MoaDja">
    <meta name="theme-color" content="#7C3AED">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <!-- CSS externes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- CSS internes -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/feed.css">
    <link rel="stylesheet" href="/css/sante.css">
    <link rel="stylesheet" href="/css/agenda.css">
    <link rel="stylesheet" href="/css/anniversaires.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/astrologie.css">
    <link rel="stylesheet" href="/css/cycle.css">
    <link rel="stylesheet" href="/css/taches.css">
    <link rel="stylesheet" href="/css/meteo.css">
    <link rel="stylesheet" href="/css/priere.css">
    <link rel="stylesheet" href="/css/islam.css">
    <link rel="stylesheet" href="/css/profil.css">
    <link rel="stylesheet" href="/css/theme-astral.css">
    <link rel="stylesheet" href="/css/tchat.css">
    <link rel="stylesheet" href="/css/pierre-naissance.css">

    <!-- Styles spécifiques intégrés -->
    <style>
        /* Gestion de l'affichage exclusif sur mobile pour le bouton tchat du header */
        @media (min-width: 769px) {
            .mobile-chat-btn { display: none !important; }
        }
        @media (max-width: 768px) {
            .mobile-chat-btn { display: inline-flex !important; }
        }
    </style>
</head>
<body>

<!-- Honeypot anti-bot -->
<div style="display:none;position:absolute;left:-9999px" aria-hidden="true">
    <input type="text"     name="fake-user" tabindex="-1" autocomplete="username">
    <input type="password" name="fake-pwd"  tabindex="-1" autocomplete="current-password">
</div>

<!-- Page de connexion -->
<div class="login-card" id="login-page">
    <img src="/icon-192.png" alt="MoaDja" style="width:72px;border-radius:16px;margin-bottom:12px;">
    <h1>MoaDja</h1>
    <form id="login-form" autocomplete="off" style="width:100%">
        <input type="text" id="username" placeholder="Nom d'utilisateur" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button type="submit" class="btn">Se connecter</button>
    </form>
    <div id="error-msg"></div>
</div>

<!-- Application principale -->
<div id="app">

    <!-- Checkbox invisible pilotant l'ouverture/fermeture de la bulle de recherche (CSS-only, aucun JS ajouté hormis inline) -->
    <input type="checkbox" id="search-toggle" class="search-toggle-checkbox">

    <!-- Topbar épurée -->
    <div class="topbar">

        <div class="topbar-left">
            <h2 id="topbar-title" onclick="switchTab('accueil');actualiser()" title="Accueil">MoaDja</h2>
        </div>

        <!-- Bulle de recherche (desktop : centrée en permanence dans le header / mobile : descend sous le header, ancrée à droite) -->
        <div class="topbar-search" id="topbar-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="topbar-search-input" placeholder="Explorer l'atelier..." autocomplete="off">
        </div>

        <div class="topbar-right" style="position:relative; display:flex; align-items:center; gap:8px;">

            <!-- Cloche notifications (icône vectorielle épurée) — ferme la recherche au clic -->
            <!-- FIX badge tronqué : badge sorti du bouton, positionné sur le wrapper (non soumis
                 à un éventuel overflow:hidden / border-radius de .icon-btn) -->
            <div style="position:relative;display:inline-flex">
                <button class="icon-btn" id="btn-cloche" onclick="document.getElementById('search-toggle').checked=false;togglePanelNotifs(event)" title="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <span id="notif-badge" style="
                    display:none;
                    position:absolute;
                    top:-4px;right:-4px;
                    background:#ef4444;
                    color:#fff;
                    font-size:10px;
                    font-weight:700;
                    min-width:18px;
                    height:18px;
                    border-radius:9px;
                    align-items:center;
                    justify-content:center;
                    padding:0 4px;
                    border:2px solid #7C3AED;
                    pointer-events:none;
                    line-height:1;
                    z-index:1;
                "></span>
            </div>

            <!-- Bouton Tchat Mobile (Visible uniquement sur mobile via CSS) — ferme la recherche au clic -->
            <!-- FIX badge tronqué : badge sorti du bouton (span devenu sibling), positionné
                 sur le wrapper englobant. Le bouton .icon-btn (souvent overflow:hidden / rond)
                 ne clippe plus le badge qui dépassait via ses offsets négatifs. -->
            <div style="position:relative;display:inline-flex">
                <button class="icon-btn mobile-chat-btn" id="btn-tchat-mobile-header" onclick="document.getElementById('search-toggle').checked=false;window.Tchat && Tchat.toggle()" title="Messages">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <span id="tchat-topbar-badge" style="
                    display:none;
                    position:absolute;
                    top:-4px;right:-4px;
                    background:#ef4444;
                    color:#fff;
                    font-size:10px;
                    font-weight:700;
                    min-width:18px;
                    height:18px;
                    border-radius:9px;
                    align-items:center;
                    justify-content:center;
                    padding:0 4px;
                    border:2px solid #7C3AED;
                    pointer-events:none;
                    line-height:1;
                    z-index:1;
                "></span>
            </div>

            <!-- Icône Recherche Mobile (label lié à la checkbox, même style que les autres icônes) — placée à droite du Tchat -->
            <label for="search-toggle" class="icon-btn mobile-search-btn" id="btn-recherche-mobile" title="Rechercher">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </label>

            <!-- Bouton profil (Mobile et Avatar Desktop) -->
            <button class="icon-btn" id="btn-profil-header" onclick="toggleUserMenu(event)" title="Mon compte">👤</button>

            <!-- Menu déroulant utilisateur -->
            <div id="user-menu" style="
                display:none;
                position:absolute;
                top:calc(100% + 8px);
                right:0;
                background:#fff;
                border-radius:12px;
                box-shadow:0 8px 24px rgba(0,0,0,0.15);
                min-width:180px;
                z-index:1000;
                overflow:hidden;
                border:1px solid #f0f0f0;
            ">
                <button class="user-menu-item" onclick="ouvrirChangelog()" style="
                    display:flex;align-items:center;gap:10px;
                    width:100%;padding:12px 16px;border:none;
                    background:none;text-align:left;font-size:14px;
                    color:#1f2937;cursor:pointer;
                " onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='none'">
                    📋 Changelog
                </button>

                <button class="user-menu-item disabled" disabled style="
                    display:flex;align-items:center;gap:10px;
                    width:100%;padding:12px 16px;border:none;
                    background:none;text-align:left;font-size:14px;
                    color:#d1d5db;cursor:not-allowed;
                ">❓ FAQ</button>

                <button class="user-menu-item" onclick="ouvrirMonProfil()" style="
                    display:flex;align-items:center;gap:10px;
                    width:100%;padding:12px 16px;border:none;
                    background:none;text-align:left;font-size:14px;
                    color:#1f2937;cursor:pointer;
                " onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='none'">
                    👤 Mon profil
                </button>

                <div style="height:1px;background:#f0f0f0;margin:4px 0"></div>

                <button class="user-menu-item" onclick="logout()" style="
                    display:flex;align-items:center;gap:10px;
                    width:100%;padding:12px 16px;border:none;
                    background:none;text-align:left;font-size:14px;
                    color:#ef4444;cursor:pointer;
                " onmouseover="this.style.background='#fff5f5'" onmouseout="this.style.background='none'">
                    🔓 Se déconnecter
                </button>
            </div>
        </div>
    </div>

    <!-- Panel notifications -->
    <div id="panel-notifs" style="display:none;position:fixed;top:68px;right:8px;width:min(380px, calc(100vw - 16px));max-height:calc(100vh - 80px);background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);z-index:500;overflow:hidden;border:1px solid #f0f0f0;flex-direction:column;">
        <div style="padding:16px 16px 0;flex-shrink:0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                <span style="font-size:18px;font-weight:800;color:#1f2937">Notifications</span>
                <button onclick="toutMarquerVu()" style="background:none;border:none;font-size:13px;font-weight:600;color:#7c3aed;cursor:pointer;padding:4px 8px;border-radius:8px">Tout marquer lu</button>
            </div>
            <div style="display:flex;gap:0;border-bottom:2px solid #f3f4f6">
                <button id="notif-tab-tout" onclick="switchNotifTab('tout')" style="flex:1;padding:8px 12px;border:none;border-bottom:2px solid #7c3aed;margin-bottom:-2px;background:none;font-size:14px;font-weight:700;color:#7c3aed;cursor:pointer">Tout</button>
                <button id="notif-tab-nonlu" onclick="switchNotifTab('nonlu')" style="flex:1;padding:8px 12px;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;background:none;font-size:14px;font-weight:600;color:#9ca3af;cursor:pointer">Non lu</button>
            </div>
        </div>
        <div id="notif-liste" style="overflow-y:auto;flex:1;padding:8px 0"></div>
        <div style="padding:8px 16px 12px;flex-shrink:0;border-top:1px solid #f3f4f6">
            <button onclick="voirPlusNotifs()" id="btn-voir-plus-notifs" style="width:100%;padding:10px;background:#f9fafb;border:none;border-radius:10px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer">Voir les notifications précédentes</button>
        </div>
    </div>

    <!-- WRAPPER : Grille applicative -->
    <div class="app-layout-wrapper">
        
        <!-- COLONNE GAUCHE (Identity Mirror & Navigation PC) -->
        <aside class="sidebar-col left-sidebar" id="identity-mirror">
            
            <!-- Composant Identity Mirror -->
            <div class="glass-panel im-panel">
                <div class="im-header">
                    <div class="im-aura-wrap">
                        <img src="/icon-192.png" alt="Avatar" id="im-avatar-img">
                    </div>
                    <h3 class="im-user-name" id="im-user-name">...</h3>
                </div>

                <div class="im-toggles-list">
                    <!-- Toggle Astral -->
                    <div class="im-toggle-item">
                        <div class="im-toggle-left">
                            <div class="im-toggle-icon-wrap" style="background: rgba(124, 58, 237, 0.1); color: #7C3AED;">🔮</div>
                            <div class="im-toggle-text">
                                <span class="im-toggle-title">Astral</span>
                                <span class="im-toggle-subtitle">Humeur du jour</span>
                            </div>
                        </div>
                    </div>
                    <!-- Toggle Mini -->
                    <div class="im-toggle-item">
                        <div class="im-toggle-left">
                            <div class="im-toggle-icon-wrap" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">🌸</div>
                            <div class="im-toggle-text">
                                <span class="im-toggle-title">Mini</span>
                            </div>
                        </div>
                        <label class="im-switch">
                            <input type="checkbox" checked>
                            <span class="im-slider"></span>
                        </label>
                    </div>
                    <!-- Toggle Sport -->
                    <div class="im-toggle-item">
                        <div class="im-toggle-left">
                            <div class="im-toggle-icon-wrap" style="background: rgba(16, 185, 129, 0.1); color: #10b981;">🏃</div>
                            <div class="im-toggle-text">
                                <span class="im-toggle-title">Sport</span>
                            </div>
                        </div>
                        <label class="im-switch">
                            <input type="checkbox">
                            <span class="im-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Navigation Desktop (Horizontale) -->
            <div class="glass-panel desktop-nav-container">
                <nav class="desktop-nav" style="display: flex; flex-direction: row; justify-content: space-between; gap: 8px;">
                    <button class="bn-item active" data-tab="accueil" onclick="switchTab('accueil')" style="flex: 1; padding: 10px 4px;">
                        <span class="bn-icon">🏠</span>
                        <span class="bn-label">Accueil</span>
                    </button>
                    <button class="bn-item" data-tab="quotidien" onclick="switchTab('quotidien')" style="flex: 1; padding: 10px 4px;">
                        <span class="bn-icon">📅</span>
                        <span class="bn-label">Quotidien</span>
                    </button>
                    <button class="bn-item" data-tab="bienetre" onclick="switchTab('bienetre')" style="flex: 1; padding: 10px 4px;">
                        <span class="bn-icon">🌸</span>
                        <span class="bn-label">Bien-être</span>
                    </button>
                    <button class="bn-item" data-tab="astral" onclick="switchTab('astral')" style="flex: 1; padding: 10px 4px;">
                        <span class="bn-icon">🔮</span>
                        <span class="bn-label">Astral</span>
                    </button>
                </nav>
            </div>
            
                        <!-- Affichage de la version pour debug -->
            <div style="text-align: center; margin-top: 16px;">
                <span id="topbar-version" style="font-size:11px;opacity:0.5;font-weight:500;color:var(--text-main)"></span>
            </div>

        </aside>

        <!-- COLONNE CENTRALE (Living Feed) -->
        <main class="center-col">
            <!-- Contenu onglets -->
            <div class="tab-content-wrap">

                <!-- ONGLET 1 — Accueil -->
                <div class="tab-pane active" id="tab-accueil">
                    <div class="accueil-meteo-fixed" id="accueil-meteo"></div>
                    <div class="accueil-feed" id="accueil-feed">
                        <div id="eclats-bandeau-1"></div>
                        <div id="eclats-bandeau-2"></div>
                    </div>
                </div>

                <!-- ONGLET 2 — Mon Quotidien -->
                <div class="tab-pane" id="tab-quotidien">
                    <div class="grid" id="grid-quotidien"></div>
                </div>

                <!-- ONGLET 3 — Bien-être -->
                <div class="tab-pane" id="tab-bienetre">
                    <div class="grid" id="grid-bienetre"></div>
                </div>

                <!-- ONGLET 4 — Astral -->
                <div class="tab-pane" id="tab-astral">
                    <div class="grid" id="grid-astral"></div>
                </div>

                <!-- ONGLET 5 — Profil (Uniquement Mobile) -->
                <div class="tab-pane" id="tab-profil">
                    <div class="grid" id="grid-profil"></div>
                </div>

            </div>
        </main>

        <!-- COLONNE DROITE (Human Link) -->
        <aside class="sidebar-col right-sidebar" id="human-link">
            <div class="glass-panel">
                <h3 style="margin-top:0;font-weight:600;color:#1f2937;">Human Link</h3>
                <p style="font-size:13px;color:#6b7280;">(Espace contacts à venir)</p>
            </div>
        </aside>

    </div>

    <!-- Bottom nav (Visible uniquement sur Mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="bn-item active" data-tab="accueil"   onclick="switchTab('accueil')">
            <span class="bn-icon">🏠</span>
            <span class="bn-label">Accueil</span>
        </button>
        <button class="bn-item" data-tab="quotidien" onclick="switchTab('quotidien')">
            <span class="bn-icon">📅</span>
            <span class="bn-label">Quotidien</span>
        </button>
        <button class="bn-item" data-tab="bienetre"  onclick="switchTab('bienetre')">
            <span class="bn-icon">🌸</span>
            <span class="bn-label">Bien-être</span>
        </button>
        <button class="bn-item" data-tab="astral"    onclick="switchTab('astral')">
            <span class="bn-icon">🔮</span>
            <span class="bn-label">Astral</span>
        </button>
        <button class="bn-item" data-tab="profil"    onclick="switchTab('profil')">
            <span class="bn-icon">👤</span>
            <span class="bn-label">Profil</span>
        </button>
    </nav>

    <div class="footer">© 2026 MoaDja — Tous droits réservés</div>
</div>

<!-- Modale générique -->
<div class="overlay" id="overlay" onclick="closeOutside(event)">
    <div class="modal">
        <button class="mclos" onclick="closeModal()">&#10005;</button>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
<script src="/socket.io/socket.io.js" defer></script>
<script src="/js/app.js"              defer></script>
<script src="/js/modal.js"            defer></script>
<script src="/js/profil.js"           defer></script>
<script src="/js/widgets.js"          defer></script>
<script src="/js/meteo.js"            defer></script>
<script src="/js/priere.js"           defer></script>
<script src="/js/islam.js"            defer></script>
<script src="/js/taches.js"           defer></script>
<script src="/js/anniversaires.js"    defer></script>
<script src="/js/admin.js"            defer></script>
<script src="/js/cycle.js"            defer></script>
<script src="/js/agenda.js"           defer></script>
<script src="/js/push.js"             defer></script>
<script src="/js/astrologie.js"       defer></script>
<script src="/js/feed.js"             defer></script>
<script src="/js/social.js"           defer></script>
<script src="/js/changelog.js"        defer></script>
<script src="/js/sante.js"            defer></script>
<script src="/js/theme-astral.js"     defer></script>
<script src="/js/pierre-naissance.js" defer></script>
<script src="/js/eclats.js"           defer></script>
<script src="/js/tchat.js"            defer></script>
</body>
</html>
